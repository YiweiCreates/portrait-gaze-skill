<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · Portrait Gaze</title>
<style>
:root{color-scheme:light;--ink:#203a35;--paper:#f4f2e9;--line:#b8c6b5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1160px;margin:auto;min-height:100svh;padding:64px 40px;display:grid;grid-template-columns:1fr 1.08fr;gap:64px;align-items:center}.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#587168}h1{white-space:pre-line;font-family:Georgia,"Songti SC",serif;font-weight:500;letter-spacing:-.035em;font-size:clamp(36px,4.2vw,58px);line-height:1.18;margin:24px 0}p{max-width:34em;font-size:16px;line-height:1.8}.en{color:#587168;font-size:14px}button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:inherit;padding:10px 14px;border-radius:6px;cursor:pointer}button:hover{background:#e5eadf}button:focus-visible{outline:3px solid #b9703c;outline-offset:4px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.art{margin:0;background:#a9b597;overflow:hidden;border-radius:5px;box-shadow:0 20px 60px #203a351c}.art svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}.outline{display:none;fill:none;stroke:#08ec83;stroke-width:2.5}.show-outlines .outline{display:block}.note{font-size:12px;color:#61736b;margin-top:36px}.version{font-size:12px;letter-spacing:.12em;margin-top:12px;color:#61736b}@media(max-width:700px){main{display:flex;flex-direction:column;gap:24px;padding:28px 22px;align-items:stretch}h1{font-size:37px;margin:14px 0}p{font-size:15px}.art{order:-1;width:min(100%,460px);align-self:center}.controls{margin-top:18px}.note{margin-top:18px}}@media(prefers-reduced-motion:reduce){.motion-note:after{content:" 系统已启用减少动态效果，眼睛保持静止。"}}
</style></head><body><main data-gaze-demo>
<section><div class="eyebrow">Portrait Gaze</div><h1>__TITLE__</h1><p class="motion-note">移动鼠标，看看眼睛如何跟随。<br>手机上可以在肖像上拖动手指。</p><p class="en">Move your pointer, or drag on the portrait.<br>Two eyes, one shared gaze direction.</p><div class="controls"><button data-toggle-motion aria-pressed="false">暂停跟随 / Pause</button><button data-toggle-outlines aria-pressed="false">显示轮廓 / Outlines</button></div><p class="note">__CREDIT__</p><div class="version">v0.1.0 · runs locally</div></section>
<figure class="art">__SVG__</figure>
</main><script>__RUNTIME__</script><script>
const data=__CONFIG__;
const portrait=document.querySelector('[data-gaze-portrait]');
window.gazeDemo=PortraitGaze.mount(portrait,data);
document.querySelector('[data-toggle-outlines]').addEventListener('click',function(){const on=portrait.classList.toggle('show-outlines');this.setAttribute('aria-pressed',String(on));this.textContent=on?'隐藏轮廓 / Hide outlines':'显示轮廓 / Outlines';});
</script></body></html>
